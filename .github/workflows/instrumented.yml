name: Stage 10 update and backup smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: Upgrade and restore · API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Verify three APKs and prepare the install pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main=5ce69cc0246c4d4fe5927be3a888a633ebb06c6a
          git merge-base --is-ancestor "$main" HEAD
          git diff --exit-code "$main" HEAD -- . ':!.github'
          mkdir -p "$RUNNER_TEMP/stage10"
          cd "$RUNNER_TEMP/stage10"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14484186030/zip" > legacy.zip
          echo "504a83242866765bc2975589637a121842966e054675022450aeff3c52ef0caa  legacy.zip" | sha256sum -c -
          unzip -q legacy.zip
          sha256sum -c legacy.apk.sha256
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14421352099/zip" > earlier.zip
          unzip -p earlier.zip app-foss-debug.apk > earlier.apk
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14477004592/zip" > latest.zip
          unzip -p latest.zip app-foss-debug.apk > latest.apk
          cat > APK.sha256 <<'EOF'
          e5bdaf371215b6e4fea6516da6544acc079f6a9c2de3f57ae2f2aef221dbe918  earlier.apk
          1214e7a7f7f42d6e8434671c3284cf5823efaa84435604ecaee22038af4ef964  latest.apk
          EOF
          sha256sum -c APK.sha256
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$signer"
          keytool -genkeypair -keystore stage10.jks -alias stage10 -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Stage 10 Emulator Fixture' -storetype JKS
          for apk in earlier.apk latest.apk; do
            "$signer" sign --ks stage10.jks --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias stage10 --v1-signing-enabled false --v4-signing-enabled false "$apk"
            "$signer" verify --print-certs "$apk"
            sha256sum "$apk"
          done
          rm stage10.jks
      - name: Prepare emulator packages with download retry
        env:
          SMOKE_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          image="system-images;android-$SMOKE_API;google_apis;x86_64"
          for attempt in 1 2 3; do
            if timeout 300 sdkmanager --install emulator "$image" &&
              test -x "$ANDROID_HOME/emulator/emulator" &&
              test -s "$ANDROID_HOME/system-images/android-$SMOKE_API/google_apis/x86_64/system.img"; then
              exit 0
            fi
            echo "SDK package download attempt $attempt did not finish"
            sleep 5
          done
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise in-place update and backup restore
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 10G
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          script: python3 -u .github/scripts/stage10-migration-smoke.py "$RUNNER_TEMP/stage10" migration-evidence ${{ matrix.api }}
      - name: Upload UI and outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage10-migration-api${{ matrix.api }}
          path: migration-evidence/
          if-no-files-found: warn
