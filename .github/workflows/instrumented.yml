name: Pre-translation acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TARGET_MAIN: 262c87fa6dc1513419af9d8619b2a8d559d674be

jobs:
  build:
    name: Build and verify candidate APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the acceptance script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build FOSS and Full from the pinned main commit
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TARGET_MAIN" HEAD
          git diff --exit-code "$TARGET_MAIN" HEAD -- . ':!.github'
          checkout_dir="$RUNNER_TEMP/candidate-source"
          git worktree add --detach "$checkout_dir" "$TARGET_MAIN"
          cd "$checkout_dir"
          test "$(git rev-parse HEAD)" = "$TARGET_MAIN"
          ./gradlew :app:assembleFossDebug --no-daemon --console=plain
          ./gradlew :app:assembleFullDebug --no-daemon --console=plain
          evidence="$RUNNER_TEMP/candidate"
          mkdir -p "$evidence"
          cp app/build/outputs/apk/foss/debug/app-foss-debug.apk "$evidence/latest.apk"
          printf '%s\n' "$TARGET_MAIN" > "$evidence/commit.txt"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          aapt="${signer%/*}/aapt"
          for variant in foss full; do
            apk="app/build/outputs/apk/$variant/debug/app-$variant-debug.apk"
            "$signer" verify --print-certs "$apk" | tee "$evidence/$variant-signature.txt"
            "$aapt" dump badging "$apk" > "$evidence/$variant-badging.txt"
            grep -F "package: name='me.lcfuns.zhiwen.debug'" "$evidence/$variant-badging.txt"
            sha256sum "$apk" | tee "$evidence/$variant-apk.sha256"
          done
          (cd "$evidence" && sha256sum latest.apk > latest.apk.sha256)

      - name: Upload the FOSS candidate and build metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-apk
          path: ${{ runner.temp }}/candidate/
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: Install, import and restore · API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Download and verify APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/stage10"
          mkdir -p "$packages"
          gh run download "$GITHUB_RUN_ID" --name candidate-apk --dir "$packages"
          cd "$packages"
          test "$(cat commit.txt)" = "$TARGET_MAIN"
          sha256sum -c latest.apk.sha256
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14484186030/zip" > legacy.zip
          echo "504a83242866765bc2975589637a121842966e054675022450aeff3c52ef0caa  legacy.zip" | sha256sum -c -
          unzip -q legacy.zip
          sha256sum -c legacy.apk.sha256
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14421352099/zip" > earlier.zip
          unzip -p earlier.zip app-foss-debug.apk > earlier.apk
          echo "e5bdaf371215b6e4fea6516da6544acc079f6a9c2de3f57ae2f2aef221dbe918  earlier.apk" | sha256sum -c -
          gh release download zh-latest --repo "$GITHUB_REPOSITORY" \
            --pattern 'knotwork-zh-20261111-1539-b678a09.apk' --output stable.apk
          echo "284d7fdbbe983e71dd2d501d4acd7b308f47a335b3f725245f90f7e52d12e804  stable.apk" | sha256sum -c -
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$signer"
          "$signer" verify --print-certs stable.apk
          "${signer%/*}/aapt" dump badging stable.apk > stable-badging.txt
          grep -E '^(package:|native-code:)' stable-badging.txt
          grep -F "package: name='app.knotwork.android'" stable-badging.txt
          keytool -genkeypair -keystore stage10.jks -alias stage10 -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Stage 10 Emulator Fixture' -storetype JKS
          for apk in earlier.apk latest.apk; do
            "$signer" sign --ks stage10.jks --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias stage10 --v1-signing-enabled false --v4-signing-enabled false "$apk"
            "$signer" verify --print-certs "$apk"
          done
          rm stage10.jks

      - name: Prepare emulator packages
        env:
          SMOKE_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          image="system-images;android-$SMOKE_API;google_apis;x86_64"
          for attempt in 1 2 3; do
            if timeout 300 sdkmanager --install emulator "$image" &&
              test -x "$ANDROID_HOME/emulator/emulator" &&
              test -s "$ANDROID_HOME/system-images/android-$SMOKE_API/google_apis/x86_64/system.img"; then
              exit 0
            fi
            echo "SDK package download attempt $attempt did not finish"
            sleep 5
          done
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise the candidate on a disposable emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 10G
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          force-avd-creation: true
          script: python3 -u .github/scripts/stage10-migration-smoke.py "$RUNNER_TEMP/stage10" migration-evidence ${{ matrix.api }}

      - name: Upload UI trees, screenshots, and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pre-translation-api${{ matrix.api }}
          path: migration-evidence/
          retention-days: 30
          if-no-files-found: warn
