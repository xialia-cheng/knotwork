name: Empty chat model status smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build the reviewed FOSS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify that product files match the fix
        run: |
          baseline=2960fd4d0bcf02d212d8a0124db5a872947d663d
          git merge-base --is-ancestor "$baseline" HEAD
          git diff --exit-code "$baseline" HEAD -- . ':!.github'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Assemble and checksum
        run: |
          ./gradlew :app:assembleFossDebug --no-daemon
          cd app/build/outputs/apk/foss/debug
          sha256sum app-foss-debug.apk | tee app-foss-debug.apk.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-model-status-foss-apk
          path: |
            app/build/outputs/apk/foss/debug/app-foss-debug.apk
            app/build/outputs/apk/foss/debug/app-foss-debug.apk.sha256
          if-no-files-found: error

  smoke:
    name: Clean startup · API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download and verify the APK built in this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "chat-model-status-foss-apk") | .id')"
          test -n "$artifact"
          cd "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > smoke-apk.zip
          unzip -q smoke-apk.zip
          sha256sum -c app-foss-debug.apk.sha256
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Prepare emulator packages with download retry
        env:
          SMOKE_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          image="system-images;android-$SMOKE_API;google_apis;x86_64"
          for attempt in 1 2 3; do
            if timeout 300 sdkmanager --install emulator "$image" &&
              test -x "$ANDROID_HOME/emulator/emulator" &&
              test -s "$ANDROID_HOME/system-images/android-$SMOKE_API/google_apis/x86_64/system.img"; then
              exit 0
            fi
            echo "SDK package download attempt $attempt did not finish"
            sleep 5
          done
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the clean startup path
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 10G
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          script: python3 -u .github/scripts/stage10-device-smoke.py "$RUNNER_TEMP/app-foss-debug.apk" model-status-evidence ${{ matrix.api }}
      - name: Upload UI and assertions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-model-status-api${{ matrix.api }}
          path: model-status-evidence/
          if-no-files-found: warn
