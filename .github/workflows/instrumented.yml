name: Stage 10 startup and recovery smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: Startup and recovery · API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify baseline and extract the reviewed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline=c3f65a226ae4e351c1660d58713508c9c3440757
          git merge-base --is-ancestor "$baseline" HEAD
          git diff --exit-code "$baseline" HEAD -- . ':!.github'
          mkdir -p stage10-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14421352099/zip" > "$RUNNER_TEMP/stage10-apk.zip"
          echo "350055d5b8e33595420d31ed03d77e9174b205103524fce1011c535b980e91be  $RUNNER_TEMP/stage10-apk.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/stage10-apk.zip" app-foss-debug.apk > "$RUNNER_TEMP/stage10.apk"
          echo "e5bdaf371215b6e4fea6516da6544acc079f6a9c2de3f57ae2f2aef221dbe918  $RUNNER_TEMP/stage10.apk" | sha256sum -c -
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise installed APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 10G
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          script: python3 -u .github/scripts/stage10-device-smoke.py "$RUNNER_TEMP/stage10.apk" stage10-evidence ${{ matrix.api }}
      - name: Upload UI and assertions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage10-startup-recovery-api${{ matrix.api }}
          path: stage10-evidence/
          if-no-files-found: warn
