name: App theme status bar smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: Status bar · API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        api: [36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download and verify the previously built APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline=16d76141f9672f480394a54dd6835cbec5f04350
          git merge-base --is-ancestor "$baseline" HEAD
          git diff --exit-code "$baseline" HEAD -- . ':!.github'
          cd "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14493545025/zip" > smoke-apk.zip
          echo "e2a5c29911f7d7302fe5d37ba0c2d3c2779b3569d45bd619238f96aa3194ff27  smoke-apk.zip" | sha256sum -c -
          unzip -q smoke-apk.zip
          sha256sum -c app-foss-debug.apk.sha256
          echo "1fd817bbfe99deba0bd7b6ac918ab62b8c229b8c43518ec6ac6045737763dd27  app-foss-debug.apk" | sha256sum -c -
      - name: Set up the PNG reader
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/status-bar-python" Pillow==11.3.0
          echo "PYTHONPATH=$RUNNER_TEMP/status-bar-python" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Prepare emulator packages with download retry
        env:
          SMOKE_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          image="system-images;android-$SMOKE_API;google_apis;x86_64"
          for attempt in 1 2 3; do
            if timeout 300 sdkmanager --install emulator "$image" &&
              test -x "$ANDROID_HOME/emulator/emulator" &&
              test -s "$ANDROID_HOME/system-images/android-$SMOKE_API/google_apis/x86_64/system.img"; then
              exit 0
            fi
            echo "SDK package download attempt $attempt did not finish"
            sleep 5
          done
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure status bar on live app themes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 10G
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          script: python3 -u .github/scripts/status-bar-smoke.py "$RUNNER_TEMP/app-foss-debug.apk" status-bar-evidence ${{ matrix.api }}
      - name: Upload UI and assertions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-bar-api${{ matrix.api }}
          path: status-bar-evidence/
          if-no-files-found: warn
