name: 9B Chinese brand and locale smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_HEAD: c04db75d977398a4690ca23544066150ffe32233

jobs:
  locale:
    name: Simplified Chinese UI · API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - name: Check out the QA script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: true
      - name: Build the exact reviewed head
        run: |
          set -euo pipefail
          git diff --exit-code "$TARGET_HEAD" HEAD -- . ':!.github'
          target="$RUNNER_TEMP/pr18-source"
          git worktree add --detach "$target" "$TARGET_HEAD"
          cd "$target"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          ./gradlew :app:assembleFossDebug --no-daemon --console=plain
          apk=app/build/outputs/apk/foss/debug/app-foss-debug.apk
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$signer" verify "$apk"
          badging="$RUNNER_TEMP/pr18-badging.txt"
          "${signer%/*}/aapt" dump badging "$apk" > "$badging"
          grep -Fx "application-label-zh:'织问 Debug'" "$badging"
          sha256sum "$apk"
      - name: Install emulator packages with bounded retries
        env:
          AUDIT_API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          image="system-images;android-$AUDIT_API;google_apis;x86_64"
          for attempt in 1 2 3; do
            if timeout 300 sdkmanager --install emulator "$image" &&
              test -s "$ANDROID_HOME/system-images/android-$AUDIT_API/google_apis/x86_64/system.img"; then
              exit 0
            fi
          done
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the language pickers, startup and dark screens
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 10G
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          force-avd-creation: true
          script: python3 -u .github/scripts/verify-zh-locale.py "$RUNNER_TEMP/pr18-source/app/build/outputs/apk/foss/debug/app-foss-debug.apk" locale-evidence ${{ matrix.api }}
      - name: Upload locale evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr18-locale-api${{ matrix.api }}
          path: locale-evidence/
          if-no-files-found: warn
